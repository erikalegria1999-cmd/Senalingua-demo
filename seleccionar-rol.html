<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Select your profile role on SENA Lingua to customize your technical English experience.">
    <title>SENA Lingua — Select Role</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- HOJAS DE ESTILO -->
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/seleccionar-rol.css">
</head>
<body>

    <!-- HEADER / NAVBAR -->
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <div class="navbar-container">
                <a href="index.html" class="logo">SENA<span> Lingua</span></a>

                <input type="checkbox" id="menu-toggle" class="menu-checkbox" aria-hidden="true">
                <label for="menu-toggle" class="mobile-menu-btn" aria-label="Toggle navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>

                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="aprendices.html">Students</a></li>
                    <li><a href="instructor.html">Instructors</a></li>
                    <li><a href="leccion.html">Lessons</a></li>
                </ul>

                <div class="nav-buttons">
                    <a href="inicio-sesion.html" class="login-btn">Log In</a>
                    <a href="registro.html" class="register-btn">Sign Up</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-wrapper">
        <div class="role-card-container">
            <span class="tag-pill">+ ONE TIME SETUP</span>
            <h1 class="card-title">Choose your role</h1>
            <p class="card-subtitle">Select how you will be using SENA Lingua. This setup is permanent for your account.</p>

            <div class="roles-grid">
                <!-- Tarjeta Aprendiz -->
                <button type="button" class="role-card" id="btn-role-aprendiz">
                    <div class="role-icon-wrapper">
                        <img src="img/apprentice.png" alt="Student Profile" class="role-avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
                    </div>
                    <h2 class="role-name">Student</h2>
                    <p class="role-desc">Access technical English modules, practice exercises, and track your learning streak.</p>
                    <span class="btn-select">Select Student</span>
                </button>

                <!-- Tarjeta Instructor -->
                <button type="button" class="role-card" id="btn-role-instructor">
                    <div class="role-icon-wrapper">
                        <img src="img/instructor.png" alt="Instructor Profile" class="role-avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3429/3429402.png'">
                    </div>
                    <h2 class="role-name">Instructor</h2>
                    <p class="role-desc">Manage learning content, monitor student progress, and evaluate technical tasks.</p>
                    <span class="btn-select">Select Instructor</span>
                </button>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-bottom">
            <div class="footer-bottom-container">
                <p>&copy; 2026 SENA Lingua — Technical English Platform for Developers.</p>
            </div>
        </div>
    </footer>

    <!-- SCRIPT DE SELECCIÓN DE ROL -->
    <script src="js/seleccionar-rol.js"></script>
</body>
</html>
