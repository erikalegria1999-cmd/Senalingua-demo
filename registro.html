<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENALingua — Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="inicioSesion.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-left-pill">
            <button class="btn-back">&larr; Back</button>
            <span class="brand-logo">&lt;/&gt; SENALingua/&gt;</span>
        </div>
        <div class="nav-right-badges">
            <span class="badge-green">ADSO - Technical English</span>
            <span class="badge-lang">GB English (UK)</span>
        </div>
    </header>

    <main class="main-wrapper">
        <div class="card-container">
            <div class="tag-pill">+ ADSO - TECHNICAL ENGLISH</div>
            <h1 class="card-title">Create your account</h1>
            <p class="card-subtitle">Register with your institutional email address to start learning.</p>

            <form action="inicio.html" class="form-layout" onsubmit="return false;">
                <div class="input-group">
                    <label for="email">EMAIL ADDRESS</label>
                    <input type="email" id="email" placeholder="Usuario@sena.edu.co">
                </div>

                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" placeholder="••••••••••••">
                </div>

                <button type="button" class="btn-green-solid" onclick="guardar()">Continue</button>
            </form>

            <div class="card-footer-text">
                <span>Already have an account?</span>
                <a href="inicioSesion.html">Sign in here</a>
            </div>
        </div>
    </main>

    <script src="registro.js"></script>
</body>
</html>
