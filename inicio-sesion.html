<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your SENA Lingua account to access your technical English lessons and resources.">
    <title>SENA Lingua — Log In</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- HOJAS DE ESTILO -->
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/inicio-sesion.css">
</head>
<body>

    <!-- HEADER / NAVBAR -->
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <div class="navbar-container">
                <a href="index.html" class="logo">SENA<span> Lingua</span></a>

                <input type="checkbox" id="menu-toggle" class="menu-checkbox" aria-hidden="true">
                <label for="menu-toggle" class="mobile-menu-btn" aria-label="Toggle navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>

                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="aprendices.html">Students</a></li>                    
                    <li><a href="leccion.html">Lessons</a></li>
                </ul>

                <div class="nav-buttons">
                    <a href="inicio-sesion.html" class="login-btn">Log In</a>
                    <a href="registro.html" class="register-btn">Sign Up</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-wrapper">
        <div class="card-container">
            <span class="tag-pill">+ SENALINGUA</span>
            <h1 class="card-title">Log in to your account</h1>
            <p class="card-subtitle">Enter your institutional credentials to access the platform.</p>

            <form id="form-login" class="form-layout">
                <div class="input-group">
                    <label for="email">EMAIL ADDRESS</label>
                    <input type="email" id="email" name="email" placeholder="user@sena.edu.co" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="forgot-wrapper">
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-submit-login">Log In</button>
            </form>

            <div class="card-footer-text">
                <span>Don't have an account?</span>
                <a href="registro.html">Sign up here</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-bottom">
            <div class="footer-bottom-container">
                <p>&copy; 2026 SENA Lingua — Technical English Platform for Developers.</p>
            </div>
        </div>
    </footer>

    <!-- SCRIPT DE INICIO DE SESIÓN -->
    <script src="js/inicio-sesion.js"></script>
</body>
</html>
